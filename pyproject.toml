[project]
name = "nuti-pipeline"
version = "0.1.0"
description = "영양대학 공공데이터 수집 · 34컬럼 계산 → product_master_YYYYMMDD.csv"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # Windows 로컬 개발에서 zoneinfo("Asia/Seoul") 용
]

[project.scripts]
pipeline = "nuti_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuti_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
