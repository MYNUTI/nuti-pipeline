[project]
name = "nuti-pipeline"
version = "0.1.0"
description = "영양대학 공공데이터 수집 · 34컬럼 계산 → product_master_YYYYMMDD.csv"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # Windows 로컬 개발에서 zoneinfo("Asia/Seoul") 용
]

[project.scripts]
pipeline = "nuti_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuti_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 실제 공공 API 를 부르는 테스트는 평소엔 건너뛴다. 손으로 돌릴 때: pytest -m live -s
markers = ["live: 실제 공공 API 를 호출하는 테스트 (한도 소모)"]
addopts = "-m 'not live'"
